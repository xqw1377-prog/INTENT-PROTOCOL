<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="intent-csrf" content="__INTENT_CSRF_TOKEN__" />
  <title>INTENT — Frozen Outcome Contract</title>
  <link rel="stylesheet" href="/web/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand-row">
        <button class="brand linklike" id="brand-home">INTENT</button>
        <span id="state-pill" class="state-pill unfrozen" title="contract state">UNFROZEN</span>
      </div>
      <nav class="topnav" id="topnav">
        <button class="navlink" data-view="CONTRACT">CONTRACT</button>
        <button class="navlink" data-view="WORK">WORK</button>
        <button class="navlink" data-view="PROOF">PROOF</button>
        <button class="navlink" data-view="OUTCOME">OUTCOME</button>
      </nav>
    </div>
    <details class="evidence-details" id="evidence-details">
      <summary>Evidence details</summary>
      <div id="facts-strip" class="facts-strip"></div>
    </details>
  </header>

  <main id="main" class="main"><!-- rendered by app.js --></main>

  <footer class="app-footer">
    <div class="app-footer-inner">
      <span class="footer-mode">Facilitated experiment · identities are declared, not authenticated</span>
      <span class="footer-links">
        <button class="linklike" id="footer-details-toggle">Technical details</button>
        <span>·</span>
        <span>Experiment trust anchor: docs/experiments/EXPERIMENT-001.md</span>
      </span>
    </div>
    <div id="footer-details" class="footer-details" hidden></div>
  </footer>

  <script src="/web/app.js"></script>
</body>
</html>
