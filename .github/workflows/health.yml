name: Main Health

# REPO-CLOSURE-R1 / R1 — the repo-wide continuous health gate.
# The six per-gate evidence workflows prove their frozen gates; this workflow
# proves TODAY'S main: fresh install, build, every package typecheck, the
# FULL vitest suite, and checkout purity (TEST-HYGIENE-R1: the suite is a
# pure function of the checkout — it must leave the tree byte-clean).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    # SECURITY-R1-AMENDMENT-2: untrusted code runs ONLY in Docker
    # containers from the pinned runtime image (no native sandbox, no
    # fallback). The darwin requirement (sandbox-exec) is retired; the
    # reference environment is Linux + Docker. Full git history is still
    # required (the historical-seal tests read pinned SHAs).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INTENT_RUNTIME_IMAGE: node:22.23.4-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
    steps:
      - name: Checkout (full history — seal tests read pinned SHAs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22 (CI reference environment)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Fresh install
        run: npm ci

      - name: Docker isolation available
        run: docker info

      - name: Pinned runtime image (pulled BY DIGEST; runs use --pull=never)
        run: |
          set -euo pipefail
          docker pull "$INTENT_RUNTIME_IMAGE"
          docker image inspect "$INTENT_RUNTIME_IMAGE" > /dev/null

      - name: Pinned image == anchored runtime_image
        run: |
          set -euo pipefail
          node -e '
            const r = JSON.parse(require("fs").readFileSync("packages/user-evidence-r0/VERIFIER-RELEASE.json","utf8"));
            if (r.runtime_image !== process.env.INTENT_RUNTIME_IMAGE) {
              console.error("runtime_image drift:", r.runtime_image, "!=", process.env.INTENT_RUNTIME_IMAGE);
              process.exit(1);
            }'

      - name: SECURITY-R1 gates (SEC-1..4C isolation, SEC-5/6 UI authority)
        run: npx vitest run packages/user-evidence-r0/test/sec-isolation.test.ts apps/experiment-ui/test/sec-ui.test.ts

      - name: Build (root tsc project graph)
        run: npm run build

      - name: Typecheck every package
        run: |
          set -euo pipefail
          status=0
          for t in packages/*/tsconfig.json; do
            d=$(dirname "$t")
            if ! npx tsc -p "$d"; then
              echo "TYPECHECK FAILED: $d"
              status=1
            fi
          done
          exit $status

      - name: Full vitest health suite
        run: npx vitest run

      - name: Hygiene gate — the suite leaves the checkout byte-clean
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "HYGIENE FAILED — the suite is not a pure function of the checkout:"
            git status --porcelain
            exit 1
          fi
          echo "HYGIENE OK — worktree clean after the full suite"
