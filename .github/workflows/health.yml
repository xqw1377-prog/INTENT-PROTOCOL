name: Main Health

# REPO-CLOSURE-R1 / R1 — the repo-wide continuous health gate.
# The six per-gate evidence workflows prove their frozen gates; this workflow
# proves TODAY'S main: fresh install, build, every package typecheck, the
# FULL vitest suite, and checkout purity (TEST-HYGIENE-R1: the suite is a
# pure function of the checkout — it must leave the tree byte-clean).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    # 2026-10-22 audit fix: the suite's reference environment is darwin
    # (macOS sandbox-exec for the net-denied verification sandbox) with
    # FULL git history (the historical-seal tests read pinned SHAs from
    # ebf1ed9/40b9ff0/bcea992/b0d7f39…). ubuntu-latest + depth-1 checkout
    # broke both (unprivileged unshare -n denied; seal commits absent),
    # which made this gate RED from birth (84798ce, 2026-10-11) without
    # any code regression. This is an environment correction, NOT a gate
    # weakening: every step still runs, on the platform the frozen suite
    # was gated on. Public repos get arm64 macOS runners free.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (full history — seal tests read pinned SHAs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22 (CI reference environment)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Fresh install
        run: npm ci

      - name: Build (root tsc project graph)
        run: npm run build

      - name: Typecheck every package
        run: |
          set -euo pipefail
          status=0
          for t in packages/*/tsconfig.json; do
            d=$(dirname "$t")
            if ! npx tsc -p "$d"; then
              echo "TYPECHECK FAILED: $d"
              status=1
            fi
          done
          exit $status

      - name: Full vitest health suite
        run: npx vitest run

      - name: Hygiene gate — the suite leaves the checkout byte-clean
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "HYGIENE FAILED — the suite is not a pure function of the checkout:"
            git status --porcelain
            exit 1
          fi
          echo "HYGIENE OK — worktree clean after the full suite"
