name: GP1 Evidence (Builder D)

# Formal machine evidence for the GP1 gate. Entry point policy mirrors the G1
# conformance-evidence workflow: manual workflow_dispatch on the DEFAULT branch
# with an exact 40-hex target SHA (the GP1 SUT commit, must be pushed).
# The harness revision and the SUT SHA are pinned separately and both recorded.
# Read-only (contents: read). Evidence uploaded on PASS and FAIL alike; a FAIL
# finding fails the job after upload (exit code deferred, never swallowed).
# Actions pinned to full commit SHAs, same set as conformance-evidence.yml.

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact GP1 SUT commit SHA (full 40 hex, must be pushed to origin)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  gp1-formal-replay:
    name: GP1 formal black-box replay evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v4.1.7
      - name: Check out verifier tooling (NOT the SUT)
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0 # capture needs the target SHA from the git object database

      - name: Resolve and pin inputs
        env:
          RAW_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$RAW_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a FULL 40-hex commit SHA, got: $RAW_TARGET_SHA"
            exit 1
          fi
          git fetch origin "$RAW_TARGET_SHA" --depth=2 2>/dev/null || true
          TARGET_SHA=$(git rev-parse "${RAW_TARGET_SHA}^{commit}")
          if [ "$TARGET_SHA" != "$RAW_TARGET_SHA" ]; then
            echo "::error::resolved SHA $TARGET_SHA does not equal input $RAW_TARGET_SHA"
            exit 1
          fi
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "HARNESS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "HARNESS_LOCKFILE_SHA256=$(sha256sum package-lock.json | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Purge stale evidence BEFORE dependency install
        run: |
          rm -rf packages/gp1-verifier/sut-snapshot packages/gp1-verifier/report
          echo "stale snapshot/report purged before npm ci"

      # actions/setup-node v4.0.2
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: 22

      - name: Install harness dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture GP1 SUT at target SHA (refuses unpinned / local-only SHAs)
        run: node packages/gp1-verifier/scripts/capture-gp1-sut.mjs --sha "$TARGET_SHA"

      - name: Oracle selftests FIRST (any red here fails the job — no green-with-broken-oracle)
        run: |
          set +e
          npx vitest run packages/gp1-verifier/test/gp1-oracle-selftest.test.ts
          ORACLE_EXIT=$?
          set -e
          echo "ORACLE_EXIT=$ORACLE_EXIT" >> "$GITHUB_ENV"
          if [ "$ORACLE_EXIT" != "0" ]; then
            echo "::error::oracle selftests FAILED (exit $ORACLE_EXIT) — formal replay will NOT run"
            exit 1
          fi

      - name: Run formal replay + build report (exit code deferred past report write)
        working-directory: packages/gp1-verifier
        env:
          # TEST-HYGIENE-R1: this CI evidence job IS the explicit builder
          # command for report/gp1-vitest-results.json (default suites write nothing)
          GP1_RECORD_EVIDENCE: "1"
        run: |
          set +e
          node scripts/gp1-report.mjs
          CODE=$?
          set -e
          echo "GP1_REPLAY_EXIT=$CODE" >> "$GITHUB_ENV"
          echo "formal replay exit: $CODE (deferred to the gate step)"

      - name: Write Job Summary
        if: always()
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
          HARNESS_SHA: ${{ env.HARNESS_SHA }}
          GP1_REPLAY_EXIT: ${{ env.GP1_REPLAY_EXIT }}
        run: |
          {
            echo "# GP1 Formal Replay — Job Summary"
            echo "- Formal target (SUT): \`$TARGET_SHA\`"
            echo "- Verifier tooling head: \`$HARNESS_SHA\`"
            echo "- Oracle selftest exit: $ORACLE_EXIT (run first; red blocks formal replay)"
            echo "- Replay exit code: $GP1_REPLAY_EXIT"
            echo "- Machine gate: see report artifact (machine READY is NEVER an automatic GP1 PASS)"
          } >> "$GITHUB_STEP_SUMMARY"

      # actions/upload-artifact v4.4.3
      - name: Upload evidence artifact (PASS and FAIL alike)
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: gp1-evidence-${{ env.TARGET_SHA }}
          path: |
            packages/gp1-verifier/report/
            packages/gp1-verifier/sut-snapshot/capture.json
          if-no-files-found: error
          retention-days: 90

      - name: Gate exit (replay FAIL fails the job)
        if: ${{ env.GP1_REPLAY_EXIT != '0' }}
        run: |
          echo "::error::GP1 formal replay exited $GP1_REPLAY_EXIT. Evidence uploaded; job fails per Commander order."
          exit 1
